[project]
name = "cpf-cnpj-validador"
version = "1.0.0"
description = "Aplicação em Python para validar e formatar CPF e CNPJ, com testes unitários."
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
